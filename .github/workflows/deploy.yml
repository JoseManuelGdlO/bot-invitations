name: CI/CD EasyPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci-back:
    name: Back CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  ci-front:
    name: Front CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - ci-back
      - ci-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build compose images
        run: docker compose build

  deploy:
    name: Trigger EasyPanel redeploy
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger deploy webhook
        env:
          EASYPANEL_DEPLOY_WEBHOOK_URL: ${{ secrets.easypanel_deploy_webhook }}
          EASYPANEL_DEPLOY_TOKEN: ${{ secrets.EASYPANEL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_WEBHOOK_URL" ]; then
            echo "Missing secret: easypanel_deploy_webhook"
            exit 1
          fi

          if [ -n "$EASYPANEL_DEPLOY_TOKEN" ]; then
            curl --fail --silent --show-error \
              -X POST "$EASYPANEL_DEPLOY_WEBHOOK_URL" \
              -H "Authorization: Bearer $EASYPANEL_DEPLOY_TOKEN"
          else
            curl --fail --silent --show-error \
              -X POST "$EASYPANEL_DEPLOY_WEBHOOK_URL"
          fi

          echo "EasyPanel redeploy triggered successfully."
