services:
  mysql:
    image: mysql:8.0
    container_name: alanna-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: alanna
      MYSQL_DATABASE: alanna
      MYSQL_USER: alanna
      MYSQL_PASSWORD: alanna
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - alanna_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ualanna", "-palanna"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  alanna_mysql_data:
