# EasyPanel / producción — NO publicar puertos en el host.
# EasyPanel enruta el tráfico vía Traefik al puerto interno del contenedor.
# MySQL vive fuera de este compose (servicio EasyPanel o host remoto).
# Para probar en local con localhost:8080 (front) / :4000 (back):
# docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  back:
    build: ./backend
    expose:
      - "4000"
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      CLIENT_URL: ${CLIENT_URL:-https://alannaconfirmaciones.com.mx}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://alannaconfirmaciones.com.mx,https://www.alannaconfirmaciones.com.mx}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-alanna}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-alanna}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-8h}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      JWT_REFRESH_REMEMBER_DAYS: ${JWT_REFRESH_REMEMBER_DAYS:-30}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL:-}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-5000}
      WA_SEND_INTERVAL_MIN_MS: ${WA_SEND_INTERVAL_MIN_MS:-15000}
      WA_SEND_INTERVAL_MAX_MS: ${WA_SEND_INTERVAL_MAX_MS:-30000}
      WA_SEND_MAX_PER_HOUR: ${WA_SEND_MAX_PER_HOUR:-20}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@alannaconfirmaciones.com.mx}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      WC_API_URL: ${WC_API_URL:-}
      WC_SERVICE_JWT: ${WC_SERVICE_JWT:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_TEMPLATE_NAME: ${META_TEMPLATE_NAME:-}
      META_TEMPLATE_LANGUAGE: ${META_TEMPLATE_LANGUAGE:-es_MX}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BOT_DEV_PLAYGROUND: ${BOT_DEV_PLAYGROUND:-false}

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.alannaconfirmaciones.com.mx/api}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://alannaconfirmaciones.com.mx}
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_GSC_VERIFICATION: ${VITE_GSC_VERIFICATION:-}
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - back
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 80
